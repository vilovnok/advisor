version: "3.8"

services:
  web:
    container_name: web
    restart: always  
    build: 
      context: ./frontend
    ports:
      - "80:80"
    expose:
      - 80  


  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest #v1.10.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local