<div class="block-list-container">
  <div class="block" *ngFor="let item of items; let i = index" (click)="navigateTo(item.url)">
    <span class="block-number">{{ i + 1 }}</span>
    <p class="block-text">{{ item.title }}</p>
  </div>
</div>
<div class="dialog-overlay" *ngIf="isDialogOpen" (click)="closeDialog()">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <h3>Детали</h3>
    <p>{{ dialogContent }}</p>
    <button (click)="closeDialog()">Закрыть</button>
  </div>
</div>

<button class="back-button" (click)="goBack()">Назад</button>
